[package]
name = "lancer-nmap"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust clone of nmap — part of the Lancer bug bounty toolkit"

[[bin]]
name = "lancer-nmap"
path = "src/main.rs"

